; =============================================================================
; PROJETO: CULTIVO — configuração do PlatformIO (build + simulação Wokwi)
; =============================================================================
; O sketch em si está em src/main.cpp (mesmo código do editor Arduino, sem
; nenhuma alteração de lógica — só a estrutura de pastas mudou, e o Blynk
; foi removido: agora o controle remoto é só pelo dashboard web).
;
; Se as libs "AsyncTCP"/"ESPAsyncWebServer" abaixo não resolverem pelo nome
; (o PlatformIO Registry às vezes tem nomes conflitantes/duplicados desses
; pacotes), troque as duas últimas linhas de lib_deps pela URL do GitHub:
;   https://github.com/ESP32Async/AsyncTCP.git
;   https://github.com/ESP32Async/ESPAsyncWebServer.git
; =============================================================================

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Necessário pro histórico (LittleFS) — garante que a partição de sistema de
; arquivos usada seja LittleFS (não SPIFFS, que é o padrão mais antigo).
board_build.filesystem = littlefs

; Mostra os avisos do compilador (ajuda a pegar erro de tipo/assinatura cedo)
build_flags =
    -Wall

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    adafruit/RTClib
    adafruit/DHT sensor library
    adafruit/Adafruit NeoPixel
    adafruit/Adafruit SHT4x Library
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer

; =============================================================================
; AMBIENTE DE UPLOAD OTA (pela rede WiFi, sem cabo USB)
; =============================================================================
; Use este ambiente (em vez do "esp32-s3-devkitc-1" acima) pra gravar depois
; que o dispositivo já estiver rodando e conectado ao WiFi. No PlatformIO,
; troque o ambiente ativo (barra de status embaixo, ou "pio run -e
; esp32-s3-devkitc-1-ota") antes de clicar em Upload.
;
; A senha abaixo PRECISA ser exatamente igual à OTA_PASSWORD no main.cpp —
; se trocar uma, troque a outra também.
;
; upload_port está fixo no IP numérico (192.168.2.149) porque "cultivo.local"
; não resolve nesse Windows (falta suporte a mDNS/Bonjour no SO). Esse IP
; vem de DHCP e PODE MUDAR — se o próximo upload OTA der "Host Not Found" ou
; timeout, confira o IP atual no OLED/Serial Monitor no boot e atualize essa
; linha. Instalar o Bonjour (https://support.apple.com/kb/DL999) resolve de
; vez, permitindo voltar a usar "cultivo.local" aqui.
[env:esp32-s3-devkitc-1-ota]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.filesystem = littlefs
build_flags =
    -Wall

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    adafruit/RTClib
    adafruit/DHT sensor library
    adafruit/Adafruit NeoPixel
    adafruit/Adafruit SHT4x Library
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer

upload_protocol = espota
upload_port = 192.168.2.149
upload_flags =
    --auth=##############
;Alterar para a senha do OTA ^
